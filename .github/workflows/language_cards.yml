name: Update language cards
on:
  schedule:
    - cron: "0 4 * * *" # Run every day at 04:00 (offset from your streak job at 03:00)
  push:
    paths:
      - ".github/workflows/language-cards.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          EXCLUDE: ""
