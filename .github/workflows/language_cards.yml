name: Update language stats

on:
  schedule:
    - cron: "30 3 * * *"

  push:
    paths:
      - ".github/workflows/language_cards.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate language stats
        run: |
          mkdir -p profile

          curl -fL \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&langs_count=10&hide_border=true&bg_color=FFFFFF&title_color=007BFF&text_color=1F2328&icon_color=007BFF" \
            -o profile/languages.svg

          echo "Checking generated SVG..."
          head -n 5 profile/languages.svg

          if ! grep -q "<svg" profile/languages.svg; then
            echo "ERROR: Downloaded file is not a valid SVG"
            cat profile/languages.svg
            exit 1
          fi

      - name: Commit language stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/languages.svg

          git diff --cached --quiet || git commit -m "Update language stats"

          git push
